name: Sync schedule

on:
  schedule:
    - cron: "0 */3 * * *"   # каждые 3 часа (время UTC)
  workflow_dispatch:         # кнопка ручного запуска во вкладке Actions

concurrency:
  group: modeus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m modeus_sync
        env:
          UNIVERSITY: ${{ vars.UNIVERSITY || 'urfu' }}
          UNIVERSITY_LOGIN: ${{ secrets.UNIVERSITY_LOGIN }}
          UNIVERSITY_PASSWORD: ${{ secrets.UNIVERSITY_PASSWORD }}
          TARGET: caldav
          CALDAV_URL: ${{ vars.CALDAV_URL }}
          CALDAV_LOGIN: ${{ secrets.CALDAV_LOGIN }}
          CALDAV_PASSWORD: ${{ secrets.CALDAV_PASSWORD }}
          CALENDAR_NAME: ${{ vars.CALENDAR_NAME }}
          DAYS_BACK: ${{ vars.DAYS_BACK }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
